name: BDD CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bdd:
    name: Cucumber BDD
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck test framework
        run: npm run typecheck

      - name: Test Open-Meteo mock server
        run: npm run test:mock

      - name: Run specification suite
        run: npm run test:bdd
        # The route shell is intentionally RED until application behavior is implemented.
        # Set the repository variable SUT_IMPLEMENTED=true to make BDD failures block CI.
        continue-on-error: ${{ vars.SUT_IMPLEMENTED != 'true' }}

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/cucumber-report.json
          if-no-files-found: error